name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The app reads API_BASE_URL from the bundled .env. Use the committed
      # one, or create it if missing (repo variable API_BASE_URL, else Render).
      - name: Ensure .env
        run: |
          if [ ! -f .env ]; then
            echo "API_BASE_URL=${{ vars.API_BASE_URL || 'https://swar-urov.onrender.com' }}" > .env
          fi
          cat .env

      # android/ is mostly gitignored (made by `make setup`), so generate the
      # missing scaffolding. Files already in the repo are kept as they are.
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.sonivo --project-name sonivo .

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: swar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
