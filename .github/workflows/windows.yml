name: Windows

on:
  workflow_call:
  workflow_dispatch:

env:
  API_BASE_URL: ${{ vars.API_BASE_URL }}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          platforms: windows
      - name: Build Windows (with retry)
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3: Building Windows release..."
            if flutter build windows --release --split-debug-info=build/symbols; then
              echo "Build succeeded on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              echo "Cleaning build directory and waiting 15 seconds before retrying..."
              flutter clean || rm -rf build
              sleep 15
            fi
          done
          echo "All 3 build attempts failed."
          exit 1
      - name: Make installer and zip
        run: |
          export SWAR_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          mkdir -p dist
          choco install innosetup -y --no-progress >/dev/null || true
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" packaging/swar.iss
          (cd build/windows/x64/runner/Release && 7z a -tzip -mx=9 "$GITHUB_WORKSPACE/dist/Swar-Windows-$SWAR_VERSION.zip" . >/dev/null)
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.exe
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
