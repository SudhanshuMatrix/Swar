# Builds Swar for every platform. Each platform has its own small workflow,
# which can also be run on its own from the Actions tab.
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    uses: ./.github/workflows/android.yml
  macos:
    uses: ./.github/workflows/macos.yml
  linux:
    uses: ./.github/workflows/linux.yml
  windows:
    uses: ./.github/workflows/windows.yml

  # Pushing a tag like v0.2.0 publishes every build as a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
