# Builds Swar for every platform. Each platform has its own small workflow,
# which can also be run on its own from the Actions tab.
#
# Releases: raise `version:` in pubspec.yaml, add a matching
# "## [x.y.z] - date" section to CHANGELOG.md, and push to master. When no
# tag v<x.y.z> exists yet, the builds are published as GitHub Release
# v<x.y.z> with that changelog section as the release notes. Pushing a tag
# like v0.2.0 by hand does the same.
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version and decide whether to release
        id: read
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pubspec.yaml version: $VERSION"

          RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
              echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match pubspec.yaml version $VERSION."
              exit 1
            fi
            RELEASE=true
          elif [[ "$GITHUB_REF" == refs/heads/master ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
              echo "v$VERSION is already released; building without a release."
            else
              RELEASE=true
            fi
          fi

          if [[ "$RELEASE" == true ]] && ! bash scripts/changelog_notes.sh "$VERSION" >/dev/null; then
            echo "::error::CHANGELOG.md has no section for $VERSION. Add a '## [$VERSION] - YYYY-MM-DD' section describing the changes, then push again."
            exit 1
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Release v$VERSION: $RELEASE"

  android:
    needs: version
    uses: ./.github/workflows/android.yml
  macos:
    needs: version
    uses: ./.github/workflows/macos.yml
  linux:
    needs: version
    uses: ./.github/workflows/linux.yml
  windows:
    needs: version
    uses: ./.github/workflows/windows.yml

  release:
    # Publishes whatever built, even if one platform failed.
    if: ${{ !cancelled() && needs.version.outputs.release == 'true' }}
    needs: [version, android, macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: bash scripts/changelog_notes.sh "${{ needs.version.outputs.version }}" > release-notes.md
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          # Keep the zips as zips; unpacked, every file inside was attached.
          skip-decompress: true
      - run: ls -l artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Swar ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          make_latest: true
          # Installers and their zips only, side by side.
          files: |
            artifacts/*.apk
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.zip
            artifacts/*.tar.gz
          fail_on_unmatched_files: false
