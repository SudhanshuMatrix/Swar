# Publishes a release by hand: Actions tab > Release > Run workflow.
#
# It builds every platform from the chosen branch and publishes GitHub
# Release v<version>, where <version> is `version:` in pubspec.yaml and the
# notes are that version's section in CHANGELOG.md. Use it to release
# without waiting for a push, or to rebuild a release that already exists
# (tick "Replace").
name: Release

on:
  workflow_dispatch:
    inputs:
      replace:
        description: Replace the release if v<version> already exists
        type: boolean
        default: false
      prerelease:
        description: Mark as a pre-release (the in-app update check ignores it)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version and check the changelog
        id: read
        env:
          REPLACE: ${{ inputs.replace }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pubspec.yaml version: $VERSION"

          if ! bash scripts/changelog_notes.sh "$VERSION" >/dev/null; then
            echo "::error::CHANGELOG.md has no section for $VERSION. Add a '## [$VERSION] - YYYY-MM-DD' section, push, then run this again."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null && [[ "$REPLACE" != true ]]; then
            echo "::error::v$VERSION is already released. Raise the version in pubspec.yaml, or run again with Replace ticked."
            exit 1
          fi

  android:
    needs: version
    uses: ./.github/workflows/android.yml
  macos:
    needs: version
    uses: ./.github/workflows/macos.yml
  linux:
    needs: version
    uses: ./.github/workflows/linux.yml
  windows:
    needs: version
    uses: ./.github/workflows/windows.yml

  release:
    needs: [version, android, macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: bash scripts/changelog_notes.sh "$VERSION" > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Remove the old release
        if: inputs.replace
        run: |
          gh release delete "v$VERSION" --yes --cleanup-tag || echo "No release v$VERSION to replace."
          git push origin ":refs/tags/v$VERSION" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Swar ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ !inputs.prerelease }}
          files: artifacts/*/*
