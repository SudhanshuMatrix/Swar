name: Android

on:
  workflow_call:
  workflow_dispatch:

env:
  API_BASE_URL: ${{ vars.API_BASE_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: ./.github/actions/setup
        with:
          platforms: android
      # The run number keeps the Android version code rising, so a new APK
      # installs over the old one. Only phone CPUs are included (emulators
      # are x86_64) and debug symbols stay out of the app, to keep it small.
      - name: Build Android APK (with retry)
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3: Building Android release APK..."
            if flutter build apk --release --build-number=${{ github.run_number }} \
              --target-platform android-arm,android-arm64 --split-debug-info=build/symbols; then
              echo "Build succeeded on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              echo "Cleaning build directory and waiting 15 seconds before retrying..."
              flutter clean || rm -rf build
              sleep 15
            fi
          done
          echo "All 3 build attempts failed."
          exit 1
      - name: APK and zip
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Swar-Android.apk
          (cd dist && zip -q Swar-Android.zip Swar-Android.apk)
      # Each file is uploaded on its own and unzipped, so the run page and
      # the release offer the .apk itself as well as the zip.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/Swar-Android.apk
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: dist/Swar-Android.zip
          archive: false
