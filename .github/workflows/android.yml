name: Android

on:
  workflow_call:
  workflow_dispatch:

env:
  API_BASE_URL: ${{ vars.API_BASE_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup
        with:
          platforms: android
      # The run number keeps the Android version code rising, so a new APK
      # installs over the old one.
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: mkdir -p dist && cp build/app/outputs/flutter-apk/app-release.apk dist/Swar-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: swar-android
          path: dist/*
