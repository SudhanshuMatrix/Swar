# Unsigned macOS app. The first time, people open it with right-click → Open
# (or System Settings → Privacy & Security → Open Anyway).
name: macOS

on:
  workflow_call:
  workflow_dispatch:

env:
  API_BASE_URL: ${{ vars.API_BASE_URL }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          platforms: macos
      - name: Build macOS (with retry)
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3: Building macOS release..."
            if flutter build macos --release --split-debug-info=build/symbols; then
              echo "Build succeeded on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              echo "Cleaning build directory and waiting 15 seconds before retrying..."
              flutter clean || rm -rf build
              sleep 15
            fi
          done
          echo "All 3 build attempts failed."
          exit 1
      - name: Make the disk image and zip
        run: |
          mkdir -p dmg dist
          cp -R build/macos/Build/Products/Release/Swar.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Swar -srcfolder dmg -ov -format ULMO dist/Swar-macOS.dmg
          ditto -c -k --keepParent build/macos/Build/Products/Release/Swar.app dist/Swar-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          path: dist/Swar-macOS.dmg
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: dist/Swar-macOS.zip
          archive: false
