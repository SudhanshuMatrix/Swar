# Unsigned macOS app. The first time, people open it with right-click → Open
# (or System Settings → Privacy & Security → Open Anyway).
name: macOS

on:
  workflow_call:
  workflow_dispatch:

env:
  API_BASE_URL: ${{ vars.API_BASE_URL }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          platforms: macos
      - run: flutter build macos --release
      - name: Make the disk image
        run: |
          mkdir -p dmg dist
          cp -R build/macos/Build/Products/Release/Swar.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Swar -srcfolder dmg -ov -format UDZO dist/Swar-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: swar-macos
          path: dist/*
